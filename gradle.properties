org.gradle.jvmargs=-Xmx4G --add-opens=java.desktop/javax.imageio.spi=ALL-UNNAMED --add-opens=java.desktop/com.sun.imageio.spi=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=26.3
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.3

# Mod Properties
mod_id=breedtimer
mod_version=1.6.2
maven_group=de.dennisthegamer.breedtimer
archives_base_name=breedtimer

# Build plugins
# 1.17-SNAPSHOT (what the 26.3 template hands out) resolves to exactly this
# release today; pinned so a CI run cannot silently pick up a different snapshot.
loom_version=1.17.21
# 2.0.141 cannot set up MC 26.3: the NeoForm recompile fails on
# HolderSet$1.contents(). 2.0.147 (bundling JST 2.0.11) is the first that builds it.
moddev_version=2.0.147

# Fabric
loader_version=0.19.5
fabric_api_version=0.160.5+26.3
modmenu_version=21.0.0-beta.1

# NeoForge
# NeoForge 26.3.0.1-beta exists since 2026-09-15 (its POM binds neoform 26.3-1).
neoforge_version=26.3.0.1-beta

# Shared mod dependencies (loader suffix appended per subproject)
yacl_version=3.9.7+26.3

# HudLib. hudlib_mc_range is kept separate from minecraft_range because HudLib
# is built per MC minor, not per patch/pre-release -- the two properties can
# diverge on a future 26.3.x. 1.2.1 (not 1.1.1 as on mc26.2): 26.3 targets start
# at 1.2.0, and 1.2.1 fixes the HUD editor drag -- MC 26.3 renumbered the left
# mouse button from 0 to 1. Its fabric.mod.json requires hudlibcore >=1.2.
hudlib_version=1.2.1
hudlib_mc_range=26.3
