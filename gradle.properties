org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft – built against 1.21.10 (Mojang mappings), supports 1.21.9 and 1.21.10.
minecraft_version=1.21.10
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar).
#
# This is a NeoForge-only branch, so both range properties are the same value; the split exists
# on the other branches because Fabric's intermediary mappings stay stable across a wider band
# than NeoForge's compile-time mojmap does. Fabric is deliberately not built here at all — the
# mc1.21.11 branch's Fabric jar already covers 1.21.9-1.21.11 in one artifact, and a second
# Fabric jar for a subset of that band would only make users pick between two right answers.
#
# Why this branch exists: Minecraft moved two things at two different versions. The render
# pipeline changed at 1.21.9 (EntityRenderer.render -> submit(..., SubmitNodeCollector,
# CameraRenderState)), and the entity packages moved at 1.21.11 (animal.Cow -> animal.cow.Cow,
# npc.Villager -> npc.villager.Villager, resources.ResourceLocation -> resources.Identifier).
# 1.21.9/1.21.10 sit between those two boundaries, so they match neither neighbouring branch:
# mc1.21.6-1.21.8 has the right class names but the old render pipeline, mc1.21.11 has the right
# render pipeline but the new class names. This branch is the 1.21.11 source compiled against
# pre-1.21.11 class names.
#
# Do not widen either range upwards. Verified 2026-08-15: this jar has 21 net/minecraft
# references that do not resolve on 1.21.11 — the exact mirror image of the 21 that the
# mc1.21.11 NeoForge jar cannot resolve here.
minecraft_range=1.21.9-1.21.10
minecraft_range_neoforge=1.21.9-1.21.10

# Mod Properties
mod_id=breedtimer
mod_version=1.6.0
maven_group=de.dennisthegamer.breedtimer
archives_base_name=breedtimer

# Build plugins
arch_plugin_version=3.5.169
arch_loom_version=1.14.476
shadow_version=9.5.1

# Fabric loader – NOT a Fabric build. Common pulls fabric-loader for the Mixin library only;
# loader classes are never called from common code (Platform interface + ServiceLoader instead).
loader_version=0.19.3
mixinextras_version=0.5.2

# NeoForge
neoforge_version=21.10.64

# Shared mod dependencies (loader suffix appended per subproject)
yacl_version=3.8.1+1.21.10
