org.gradle.jvmargs=-Xmx4G --add-opens=java.desktop/javax.imageio.spi=ALL-UNNAMED --add-opens=java.desktop/com.sun.imageio.spi=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=26.1.2
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=26.1-26.1.2
# NeoForge only runs from 26.1.2 onward within the 26.1 line (no working floor below that);
# Fabric covers 26.1-26.1.2. Hence a separate range for the NeoForge jar name.
minecraft_range_neoforge=26.1.2

# Mod Properties
mod_id=breedtimer
mod_version=1.6.1
maven_group=de.dennisthegamer.breedtimer
archives_base_name=breedtimer

# Build plugins
loom_version=1.17.13
moddev_version=2.0.141

# Fabric
loader_version=0.18.4
fabric_api_version=0.144.3+26.1
modmenu_version=18.0.0-alpha.8

# NeoForge
neoforge_version=26.1.2.78

# Shared mod dependencies (loader suffix appended per subproject)
yacl_version=3.9.4+26.1
