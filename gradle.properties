org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft – built against 1.21.1 (Mojang mappings), supports 1.21–1.21.1.
minecraft_version=1.21.1
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=1.21-1.21.1

# Mod Properties
mod_id=breedtimer
mod_version=1.6.0
maven_group=de.dennisthegamer.breedtimer
archives_base_name=breedtimer

# Build plugins
arch_plugin_version=3.5.169
arch_loom_version=1.14.476
shadow_version=9.5.1

# Fabric
loader_version=0.19.3
fabric_api_version=0.116.13+1.21.1
mixinextras_version=0.5.2
modmenu_version=11.0.4

# NeoForge
neoforge_version=21.1.235

# Shared mod dependencies (loader suffix appended per subproject)
yacl_version=3.8.2+1.21.1

# fabric.mod.json dependency ranges (override per-version with -P flags)
minecraft_dep=>=1.21 <=1.21.1
fabricloader_dep=>=0.17.0
