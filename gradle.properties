org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft – built against 1.21.11 (Mojang mappings), supports 1.21.9–1.21.11 on Fabric.
minecraft_version=1.21.11
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar).
# Fabric/common use this range: Fabric jars are intermediary-mapped, which stays stable
# across 1.21.9-1.21.11, so one jar genuinely covers the whole band.
minecraft_range=1.21.9-1.21.11
# NeoForge-only range: NeoForge jars bake in Mojang mappings (mojmap) at compile time, unlike
# Fabric's version-stable intermediary. 1.21.11 reorganized entity packages (e.g. animal.Cow ->
# animal.cow.Cow, npc.Villager -> npc.villager.Villager; 17 classes moved), so a jar compiled
# against 1.21.11 mojmap cannot run on 1.21.9/1.21.10 (18 of 80 net/minecraft references don't
# resolve there). NeoForge Band B is therefore intentionally 1.21.11-only — do not widen this to
# match minecraft_range without re-verifying every moved class resolves across the whole band.
minecraft_range_neoforge=1.21.11

# Mod Properties
mod_id=breedtimer
mod_version=1.4.1
maven_group=de.dennisthegamer.breedtimer
archives_base_name=breedtimer

# Build plugins
arch_plugin_version=3.5.169
arch_loom_version=1.14.476
shadow_version=9.5.1

# Fabric
loader_version=0.19.3
fabric_api_version=0.141.4+1.21.11
mixinextras_version=0.5.2
modmenu_version=17.0.0

# NeoForge
neoforge_version=21.11.42

# Shared mod dependencies (loader suffix appended per subproject)
yacl_version=3.8.2+1.21.11

# fabric.mod.json dependency ranges (override per-version with -P flags)
minecraft_dep=>=1.21.9 <=1.21.11
fabricloader_dep=>=0.17.0
