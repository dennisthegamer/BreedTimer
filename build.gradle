plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

	maven {
		name = "YACL"
		url = "https://maven.isxander.dev/releases"
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"breedtimer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras 0.5.x explicitly: EXPRESSION injection point (used by Fabric API 0.140+)
	// was introduced in 0.5.x. Without this, older loaders that bundle 0.4.x crash.
	modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

	// YACL for configuration UI
	modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// ModMenu for config screen access
	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Loom 1.14 adds --sun-misc-unsafe-memory-access=allow which requires Java 23+.
// Remove it so the dev client runs under Java 21.
afterEvaluate {
	tasks.withType(JavaExec).configureEach {
		jvmArgs = jvmArgs.findAll { !it.startsWith("--sun-misc-unsafe-memory-access") }
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
