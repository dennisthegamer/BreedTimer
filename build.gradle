plugins {
	id 'architectury-plugin' version "${arch_plugin_version}"
	id 'dev.architectury.loom-remap' version "${arch_loom_version}" apply false
}

architectury {
	minecraft = project.minecraft_version
}

subprojects {
	apply plugin: 'dev.architectury.loom-remap'

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings loom.officialMojangMappings()
	}
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'

	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	base {
		archivesName = "${rootProject.archives_base_name}-${project.name}"
	}

	repositories {
		mavenCentral()
		maven {
			name = 'YACL'
			url = 'https://maven.isxander.dev/releases'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/releases'
		}
		maven {
			name = 'Modrinth'
			url = 'https://api.modrinth.com/maven'
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 21
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	// Loom adds --sun-misc-unsafe-memory-access=allow which requires Java 23+.
	// Remove it so the dev client runs under Java 21.
	afterEvaluate {
		tasks.withType(JavaExec).configureEach {
			jvmArgs = jvmArgs.findAll { !it.startsWith("--sun-misc-unsafe-memory-access") }
		}
	}
}
