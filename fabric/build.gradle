plugins {
	id 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+mc${project.minecraft_range}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
	mavenLocal()
	maven {
		name = 'DennisTheGamer'
		url = 'https://dennisthegamer.github.io/maven'
	}
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'YACL'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
}

sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// HudLib (mavenLocal, jar-in-jar)
	implementation "de.dennisthegamer:hudlib-core:1.1.1"
	include "de.dennisthegamer:hudlib-core:1.1.1"
	implementation "de.dennisthegamer:hudlib-ui:1.1.1+mc26.1"
	include "de.dennisthegamer:hudlib-ui:1.1.1+mc26.1"

	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

loom {
	runs.named('client') {
		ideConfigGenerated true
		runDir 'run'
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
