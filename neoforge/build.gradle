plugins {
	id 'net.neoforged.moddev'
}

// NeoForge laeuft im 26.1-Band erst ab 26.1.2; Fabric deckt 26.1-26.1.2 ab.
def mcRange = project.findProperty("minecraft_range_neoforge") ?: project.minecraft_range
version = "${project.mod_version}+mc${mcRange}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
	mavenLocal()
	maven {
		name = 'DennisTheGamer'
		url = 'https://dennisthegamer.github.io/maven'
	}
	mavenCentral()
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
	maven {
		name = 'YACL'
		url = 'https://maven.isxander.dev/releases'
	}
}

sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
		}
	}

	mods {
		register(project.mod_id) {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"

	// HudLib (mavenLocal, jar-in-jar via NeoForge JarJar)
	implementation "de.dennisthegamer:hudlib-core:1.1.1"
	jarJar "de.dennisthegamer:hudlib-core:1.1.1"
	implementation "de.dennisthegamer:hudlib-ui-neoforge:1.1.1+mc26.1"
	jarJar "de.dennisthegamer:hudlib-ui-neoforge:1.1.1+mc26.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
