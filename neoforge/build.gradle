plugins {
	id 'com.gradleup.shadow' version "${shadow_version}"
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

repositories {
	mavenLocal()
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
	maven {
		name = 'QuiltMC'
		url = 'https://maven.quiltmc.org/repository/release/'
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

	// YACL is optional at runtime — compile-only so the jar doesn't force it
	modCompileOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"

	// ...but load YACL in the dev client so the config screen is testable.
	// YACL's jar-in-jar libraries don't load in the loom dev runtime, so its
	// quilt-parsers dependency must join the FML module layer explicitly.
	modLocalRuntime "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"
	forgeRuntimeLibrary "org.quiltmc.parsers:json:0.3.1"
	forgeRuntimeLibrary "org.quiltmc.parsers:gson:0.3.1"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }

	// jar-in-jar: hudlib-core is pure Java (no Minecraft refs), so it can be included directly.
	include "de.dennisthegamer:hudlib-core:1.0.8"
	// jar-in-jar: hudlib-ui must be the mojmap variant here. The default artifact is remapped to
	// intermediary for Fabric, and nothing in the NeoForge include pipeline converts it back, so
	// bundling it made the config screen die on NoClassDefFoundError: net/minecraft/class_437.
	// Plain include + compileOnly on purpose: modImplementation would send it through Loom's
	// remap pipeline, which is exactly what must not happen to an already-mojmap jar.
	compileOnly "de.dennisthegamer:hudlib-ui-neoforge:1.0.8+mc1.21-1.21.8"
	include "de.dennisthegamer:hudlib-ui-neoforge:1.0.8+mc1.21-1.21.8"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
